<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Choose character Game</title>
</head>

<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center">

    <div class="card justify-content-center align-items-center d-flex" style="width: 40rem; top: 10rem;">
        <div class="card-body" >

            <div class="form-group">
                <h1 class="justify-content-center align-items-center d-block">Welcome to Choose your Character!</h1>
            </div>

            <div class="form-group justify-content-center align-items-center mt-2" style="display: block;">
                <p class="justify-content-center align-items-center d-flex my-1">Please choose your Character!</p>
                <div class="d-flex justify-content-center align-items-center">
                    <button class="btn btn-secondary mx-1" id="btnWarrior">Warrior</button>
                    <button class="btn btn-secondary mx-1" id="btnMage">Mage</button>
                    <button class="btn btn-secondary mx-1" id="btnArcher">Archer</button>
                    <button class="btn btn-secondary mx-1" id="btnAssassin">Assassin</button>
                </div>

                <p class="justify-content-center align-items-center d-flex mt-2">Current character: <span class="m-1" id="DisplayCurrentCharacter">...</span></p>
            </div>


    </div>
</div>

<script src="scripts/7SelectCharacter.js"></script>

</body>

</html>
